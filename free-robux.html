<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>SYSTEM CRITICAL ERROR - 0x80070002</title>
    <style>
        body { background-color: #0000aa; color: white; font-family: 'Courier New', monospace; text-align: center; padding-top: 10vh; margin: 0; overflow: hidden; }
        h1 { font-size: 3rem; text-shadow: 2px 2px red; }
        .box { background: #000; border: 3px solid red; width: 60%; margin: auto; padding: 20px; box-shadow: 0 0 50px red; }
        button { background: red; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background: white; color: red; }
    </style>
</head>
<body onclick="annoy()">

    <div class="box">
        <h1>⚠️ WARNING: SYSTEM FAILURE ⚠️</h1>
        <p>ตรวจพบไวรัสสายพันธุ์ใหม่ในเครื่องของคุณ: <b>Troll-Virus.exe</b></p>
        <p>ระบบกำลังลบข้อมูลรูปภาพและประวัติการแชททั้งหมดใน 10 วินาที...</p>
        <p id="counter" style="font-size: 2rem; color: yellow;">10</p>
        <button onclick="triggerChaos()">คลิกเพื่อกู้คืนระบบด่วน!</button>
    </div>

    <script>
        let count = 10;
        const timer = setInterval(() => {
            count--;
            document.getElementById('counter').innerText = count;
            if(count <= 0) {
                count = 10; // วนลูปนับถอยหลังไปเรื่อยๆ ไม่มีวันจบ
            }
        }, 1000);

        function annoy() {
            alert("⚠️ แจ้งเตือน: คุณได้คลิกโดนไวรัสกระจายตัวเพิ่มอีก 10 ตัวแล้ว!");
        }

        function triggerChaos() {
            alert("❌ ไม่สำเร็จ! ไฟล์ของคุณถูกล็อกเรียบร้อยแล้ว ฮ่าๆๆๆ");
            for(let i=0; i<5; i++) {
                window.open(window.location.href, '_blank', 'width=400,height=300');
            }
        }
    </script>
</body>
</html>
