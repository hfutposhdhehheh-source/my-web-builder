<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมปลูกผักแสนสนุก (ฉบับสมบูรณ์)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f7f4;
            color: #333;
            padding: 20px;
        }

        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .game-header {
            background-color: #2e7d32;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .status-bar {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 1.1rem;
            flex-wrap: wrap;
        }

        .game-body {
            display: flex;
            gap: 20px;
            padding: 20px;
            flex-wrap: wrap;
        }

        .farm-section {
            flex: 2;
            min-width: 300px;
        }

        .farm-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .plot {
            background-color: #d7ccc8;
            border: 2px dashed #8d6e63;
            border-radius: 8px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            text-align: center;
            gap: 5px;
            font-size: 0.9rem;
        }

        .plot.tilled {
            background-color: #795548;
            border-style: solid;
            color: white;
        }

        .plot.growing {
            background-color: #aed581;
            border-style: solid;
            color: #1b5e20;
        }

        .plot.ready {
            background-color: #ffb74d;
            border-style: solid;
            color: #e65100;
            animation: pulse 1s infinite alternate;
        }

        .plot.dead {
            background-color: #9e9e9e;
            border-style: solid;
            color: #fff;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        .sidebar {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
        }

        .panel h3 {
            margin-bottom: 10px;
            color: #2e7d32;
            border-bottom: 2px solid #c8e6c9;
            padding-bottom: 5px;
        }

        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin: 2px;
            font-size: 0.85rem;
        }

        button:hover {
            background-color: #388e3c;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- ส่วนหัวแสดงสถานะ -->
        <header class="game-header">
            <h1>🌱 ฟาร์มสุขของฉัน (Single File Edition)</h1>
            <div class="status-bar">
                <span>💰 เงิน: <strong id="money">100</strong> หน่วย</span>
                <span>📅 วันที่: <strong id="current-day">1</strong></span>
                <span>☀️ ฤดู: <strong id="current-season">ใบไม้ผลิ</strong></span>
                <span>🌤️ อากาศ: <strong id="current-weather">ปกติ</strong></span>
            </div>
        </header>

        <!-- เนื้อหาหลัก -->
        <div class="game-body">
            <!-- แปลงปลูกผัก -->
            <section class="farm-section">
                <h2>แปลงปลูกผัก (9 แปลง)</h2>
                <div id="farm-grid" class="farm-grid">
                    <!-- สร้างด้วย JavaScript -->
                </div>
            </section>

            <!-- เมนูด้านข้าง -->
            <aside class="sidebar">
                <!-- ร้านค้า -->
                <div class="panel">
                    <h3>🛒 ร้านค้า</h3>
                    <div id="shop-items"></div>
                </div>

                <!-- คลังสินค้า -->
                <div class="panel">
                    <h3>📦 คลังสินค้า</h3>
                    <div id="inventory-list"></div>
                </div>

                <!-- ความสำเร็จ -->
                <div class="panel">
                    <h3>🏆 ความสำเร็จ</h3>
                    <div id="achievements-list"></div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        // ข้อมูลพืช
        const cropTypes = {
            carrot: { name: "แครอท", icon: "🥕", buy: 10, sell: 25, time: 30, waterReq: 1, season: ["ใบไม้ผลิ", "ใบไม้ร่วง"] },
            tomato: { name: "มะเขือเทศ", icon: "🍅", buy: 25, sell: 60, time: 60, waterReq: 2, season: ["ร้อน"] },
            corn: { name: "ข้าวโพด", icon: "🌽", buy: 40, sell: 100, time: 90, waterReq: 3, season: ["ร้อน"] }
        };

        // สถานะเกม
        let gameState = {
            money: 100,
            day: 1,
            season: "ใบไม้ผลิ",
            weather: "ปกติ",
            lastSaveTime: Date.now(),
            plots: Array(9).fill(null).map(() => ({
                status: "empty", // empty, tilled, growing, ready, dead
                crop: null,
                plantedTime: 0,
                waterCount: 0,
                fertilized: false
            })),
            inventory: {
                seeds: { carrot: 3, tomato: 0, corn: 0 },
                crops: { carrot: 0, tomato: 0, corn: 0 },
                fertilizer: 1,
                pesticide: 1
            },
            achievements: {
                beginner: false
            }
        };

        // โหลดเกม
        function loadGame() {
            const saved = localStorage.getItem("myFarmingGameSave");
            if (saved) {
                const loadedState = JSON.parse(saved);
                gameState = { ...gameState, ...loadedState };
                calculateOfflineProgress();
            }
        }

        // บันทึกเกม
        function saveGame() {
            gameState.lastSaveTime = Date.now();
            localStorage.setItem("myFarmingGameSave", JSON.stringify(gameState));
        }

        // คำนวณเวลาตอนปิดหน้าเว็บ
        function calculateOfflineProgress() {
            const now = Date.now();
            const elapsedSeconds = Math.floor((now - gameState.lastSaveTime) / 1000);
            if (elapsedSeconds <= 0) return;

            gameState.plots.forEach(plot => {
                if (plot.status === "growing" && plot.crop) {
                    const cropInfo = cropTypes[plot.crop];
                    if (elapsedSeconds >= cropInfo.time) {
                        // เช็คว่ารดน้ำพอไหม ถ้าไม่พออาจตายหรือค้าง
                        if (plot.waterCount >= cropInfo.waterReq) {
                            plot.status = "ready";
                        } else {
                            plot.status = "dead";
                        }
                    }
                }
            });
        }

        // วาดหน้าจอแปลง
        function renderFarm() {
            const grid = document.getElementById("farm-grid");
            grid.innerHTML = "";

            gameState.plots.forEach((plot, index) => {
                const div = document.createElement("div");
                div.className = `plot ${plot.status}`;

                if (plot.status === "empty") {
                    div.innerHTML = `<span>🟫 ดินว่างเปล่า</span><button onclick="tillPlot(${index})">ไถดิน</button>`;
                } else if (plot.status === "tilled") {
                    div.innerHTML = `<span>🟫 ดินพร้อมปลูก</span>
                        <div>
                            <button onclick="plantCrop(${index}, 'carrot')">🥕 แครอท</button>
                            <button onclick="plantCrop(${index}, 'tomato')">🍅 มะเขือเทศ</button>
                            <button onclick="plantCrop(${index}, 'corn')">🌽 ข้าวโพด</button>
                        </div>`;
                } else if (plot.status === "growing") {
                    const crop = cropTypes[plot.crop];
                    div.innerHTML = `<span>${crop.icon} กำลังโต (${crop.name})</span>
                        <span>น้ำ: ${plot.waterCount}/${crop.waterReq}</span>
                        <div>
                            <button onclick="waterPlot(${index})">💦 รดน้ำ</button>
                            ${!plot.fertilized ? `<button onclick="fertilizePlot(${index})">🧪 ใส่ปุ๋ย</button>` : ''}
                        </div>`;
                } else if (plot.status === "ready") {
                    const crop = cropTypes[plot.crop];
                    div.innerHTML = `<span>✨ ${crop.name} พร้อมเก็บ!</span>
                        <button onclick="harvestPlot(${index})">🧺 เก็บเกี่ยว</button>`;
                } else if (plot.status === "dead") {
                    div.innerHTML = `<span>💀 พืชตายแล้ว</span><button onclick="clearDead(${index})">🧹 ทำความสะอาด</button>`;
                }

                grid.appendChild(div);
            });
        }

        // วาดส่วน UI ร้านค้า คลัง และอื่นๆ
        function renderUI() {
            document.getElementById("money").innerText = gameState.money;
            document.getElementById("current-day").innerText = gameState.day;
            document.getElementById("current-season").innerText = gameState.season;
            document.getElementById("current-weather").innerText = gameState.weather;

            // ร้านค้า
            const shopDiv = document.getElementById("shop-items");
            shopDiv.innerHTML = `
                <div class="item-row"><span>เมล็ดแครอท (10)</span><button onclick="buyItem('seed', 'carrot', 10)">ซื้อ</button></div>
                <div class="item-row"><span>เมล็ดมะเขือเทศ (25)</span><button onclick="buyItem('seed', 'tomato', 25)">ซื้อ</button></div>
                <div class="item-row"><span>เมล็ดข้าวโพด (40)</span><button onclick="buyItem('seed', 'corn', 40)">ซื้อ</button></div>
                <div class="item-row"><span>ปุ๋ยเร่งโต (30)</span><button onclick="buyItem('fertilizer', null, 30)">ซื้อ</button></div>
            `;

            // คลังสินค้า
            const invDiv = document.getElementById("inventory-list");
            invDiv.innerHTML = `
                <div class="item-row"><span>เมล็ดแครอท: ${gameState.inventory.seeds.carrot}</span></div>
                <div class="item-row"><span>เมล็ดมะเขือเทศ: ${gameState.inventory.seeds.tomato}</span></div>
                <div class="item-row"><span>เมล็ดข้าวโพด: ${gameState.inventory.seeds.corn}</span></div>
                <hr style="margin: 5px 0;">
                <div class="item-row"><span>แครอท (ขาย 25): ${gameState.inventory.crops.carrot}</span><button onclick="sellCrop('carrot', 25)">ขาย</button></div>
                <div class="item-row"><span>มะเขือเทศ (ขาย 60): ${gameState.inventory.crops.tomato}</span><button onclick="sellCrop('tomato', 60)">ขาย</button></div>
                <div class="item-row"><span>ข้าวโพด (ขาย 100): ${gameState.inventory.crops.corn}</span><button onclick="sellCrop('corn', 100)">ขาย</button></div>
                <div class="item-row"><span>ปุ๋ยในตัว: ${gameState.inventory.fertilizer}</span></div>
            `;

            // ความสำเร็จ
            const achDiv = document.getElementById("achievements-list");
            achDiv.innerHTML = `
                <div class="item-row"><span>🏆 มือใหม่หัดปลูก: ${gameState.achievements.beginner ? '✅ สำเร็จแล้ว' : '❌ ยังไม่สำเร็จ'}</span></div>
            `;
        }

        // ระบบการเล่น
        function tillPlot(index) {
            gameState.plots[index].status = "tilled";
            saveAndRefresh();
        }

        function plantCrop(index, cropKey) {
            if (gameState.inventory.seeds[cropKey] > 0) {
                gameState.inventory.seeds[cropKey]--;
                gameState.plots[index] = {
                    status: "growing",
                    crop: cropKey,
                    plantedTime: Date.now(),
                    waterCount: 0,
                    fertilized: false
                };
                saveAndRefresh();
            } else {
                alert("เมล็ดพันธุ์หมด!");
            }
        }

        function waterPlot(index) {
            gameState.plots[index].waterCount++;
            saveAndRefresh();
        }

        function fertilizePlot(index) {
            if (gameState.inventory.fertilizer > 0) {
                gameState.inventory.fertilizer--;
                gameState.plots[index].fertilized = true;
                // ปุ๋ยช่วยลดเวลาโตครึ่งหนึ่ง
                saveAndRefresh();
            } else {
                alert("ปุ๋ยหมด!");
            }
        }

        function harvestPlot(index) {
            const cropKey = gameState.plots[index].crop;
            gameState.inventory.crops[cropKey]++;
            
            // เช็คความสำเร็จ
            if (!gameState.achievements.beginner && gameState.inventory.crops[cropKey] >= 1) {
                gameState.achievements.beginner = true;
                gameState.money += 50;
                alert("🎉 ปลดล็อกความสำเร็จ: มือใหม่หัดปลูก รับโบนัส 50 หน่วย!");
            }

            gameState.plots[index] = { status: "empty", crop: null, plantedTime: 0, waterCount: 0, fertilized: false };
            saveAndRefresh();
        }

        function clearDead(index) {
            gameState.plots[index] = { status: "empty", crop: null, plantedTime: 0, waterCount: 0, fertilized: false };
            saveAndRefresh();
        }

        function buyItem(type, key, price) {
            if (gameState.money >= price) {
                gameState.money -= price;
                if (type === 'seed') gameState.inventory.seeds[key]++;
                if (type === 'fertilizer') gameState.inventory.fertilizer++;
                saveAndRefresh();
            } else {
                alert("เงินไม่พอ!");
            }
        }

        function sellCrop(cropKey, price) {
            if (gameState.inventory.crops[cropKey] > 0) {
                gameState.inventory.crops[cropKey]--;
                gameState.money += price;
                saveAndRefresh();
            } else {
                alert("ไม่มีผลผลิตนี้ในคลัง!");
            }
        }

        function saveAndRefresh() {
            saveGame();
            renderFarm();
            renderUI();
        }

        // ตรวจสอบเวลาโตทุกๆ 1 วินาที
        setInterval(() => {
            let changed = false;
            const now = Date.now();
            gameState.plots.forEach(plot => {
                if (plot.status === "growing" && plot.crop) {
                    let cropInfo = cropTypes[plot.crop];
                    let requiredTime = plot.fertilized ? cropInfo.time / 2 : cropInfo.time;
                    let elapsed = (now - plot.plantedTime) / 1000;

                    if (elapsed >= requiredTime) {
                        if (plot.waterCount >= cropInfo.waterReq) {
                            plot.status = "ready";
                        } else {
                            plot.status = "dead";
                        }
                        changed = true;
                    }
                }
            });
            if (changed) {
                renderFarm();
            }
        }, 1000);

        // บันทึกอัตโนมัติทุก 30 วิ
        setInterval(saveGame, 30000);

        // เริ่มเกม
        window.onload = function() {
            loadGame();
            renderFarm();
            renderUI();
        };
    </script>
</body>
</html>
