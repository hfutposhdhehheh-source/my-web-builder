<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniCode Studio - AI Connected</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js สำหรับแปลงข้อความ AI เป็น Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden select-none">

    <!-- Topbar Header -->
    <header class="h-14 bg-slate-900 border-b border-slate-800 px-4 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-brand-500 text-white p-1.5 rounded-lg font-bold text-xs"><i class="fa-solid fa-brain"></i></div>
            <h1 class="font-bold text-sm tracking-tight hidden sm:inline">OmniCode Studio</h1>
            <select id="lang-selector" class="bg-slate-950 border border-slate-800 text-xs rounded px-2 py-1 text-slate-300 focus:outline-none focus:border-brand-500">
                <option value="javascript">Lua / JavaScript</option>
                <option value="html">HTML / CSS</option>
                <option value="python">Python</option>
                <option value="cpp">C++</option>
                <option value="java">Java</option>
                <option value="sql">SQL</option>
                <option value="php">PHP</option>
            </select>
        </div>

        <!-- ช่องใส่ API Key และปุ่มสั่งการ -->
        <div class="flex items-center space-x-2">
            <div class="relative">
                <input type="password" id="api-key-input" placeholder="วาง Gemini API Key ที่นี่..." class="bg-slate-950 border border-slate-800 text-xs rounded-lg px-3 py-1.5 text-slate-300 w-40 sm:w-56 focus:outline-none focus:border-brand-500">
            </div>
            <button onclick="analyzeWithRealAI()" class="bg-brand-600 hover:bg-brand-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 shrink-0">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span class="hidden sm:inline">ให้ AI ตรวจสอบ</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 grid grid-cols-1 lg:grid-cols-3 h-[calc(100vh-56px)] overflow-hidden">
        
        <!-- Editor Section -->
        <div class="lg:col-span-2 flex flex-col h-full border-r border-slate-800 bg-slate-900 relative">
            <div class="bg-slate-950 px-4 py-2 text-xs font-semibold text-slate-400 flex items-center justify-between shrink-0 border-b border-slate-800">
                <span><i class="fa-solid fa-file-code mr-1.5 text-brand-500"></i> พื้นที่เขียนโค้ด</span>
                <span class="text-[10px] text-slate-500">Gemini API Powered</span>
            </div>
            <textarea id="code-textarea" class="flex-1 bg-slate-900 p-4 font-mono text-xs text-slate-200 resize-none focus:outline-none leading-relaxed" placeholder="พิมพ์หรือวางโค้ดที่ต้องการให้ AI ตรวจสอบที่นี่..."></textarea>
        </div>

        <!-- AI Advisor Panel -->
        <div class="flex flex-col h-full bg-slate-950 overflow-hidden">
            <div class="bg-slate-900 px-4 py-2 text-xs font-semibold text-brand-400 flex items-center justify-between shrink-0 border-b border-slate-800">
                <span><i class="fa-solid fa-robot mr-1.5"></i> ผลวิเคราะห์จาก AI</span>
                <span id="ai-status-dot" class="w-2 h-2 rounded-full bg-slate-600"></span>
            </div>
            <div id="ai-feedback-container" class="flex-1 p-4 overflow-y-auto space-y-3 text-xs leading-relaxed">
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-slate-300">
                    <div class="font-bold text-brand-400 mb-1"><i class="fa-solid fa-circle-info mr-1"></i> วิธีใช้งาน</div>
                    <p class="text-slate-400 text-[11px]">1. นำ Gemini API Key มาใส่ที่ช่องขวาบน<br>2. เขียนโค้ดฝั่งซ้าย<br>3. กดปุ่ม "ให้ AI ตรวจสอบ"</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 border border-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50"></div>

    <!-- Script Logic เชื่อมต่อ Gemini API -->
    <script>
        const apiKeyInput = document.getElementById('api-key-input');
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) apiKeyInput.value = savedKey;

        apiKeyInput.addEventListener('input', () => {
            localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
        });

        async function analyzeWithRealAI() {
            const apiKey = apiKeyInput.value.trim();
            const code = document.getElementById('code-textarea').value.trim();
            const lang = document.getElementById('lang-selector').value;
            const container = document.getElementById('ai-feedback-container');
            const statusDot = document.getElementById('ai-status-dot');

            if (!apiKey) {
                showToast('กรุณากรอก Gemini API Key ก่อนครับ');
                return;
            }
            if (!code) {
                showToast('กรุณาใส่โค้ดที่ต้องการตรวจสอบ');
                return;
            }

            showToast('AI กำลังวิเคราะห์โค้ด...');
            statusDot.className = 'w-2 h-2 rounded-full bg-yellow-500 animate-pulse';
            
            container.innerHTML = `<div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-slate-400 animate-pulse">กำลังประมวลผลผ่าน Gemini API...</div>`;

            const promptText = `คุณคือ Code Reviewer ผู้เชี่ยวชาญ กรุณาตรวจสอบโค้ดนี้อย่างละเอียด:
\`\`\`
${code}
\`\`\`
กรุณาจัดรูปแบบคำตอบเป็นภาษาไทย โดยแบ่งเป็น:
1. 🔴 **จุดที่ต้องแก้ไขด่วน (สีแดง):** 
2. 🟡 **จุดที่ควรปรับปรุง/เปลี่ยน (สีเหลือง):** 
3. 🟢 **ส่วนที่ทำได้ดีแล้ว (สีเขียว):** 
จัดรูปแบบให้อ่านง่าย กระชับ ใช้ Markdown ประกอบ`;

            try {
                // เปลี่ยนมาใช้โมเดล gemini-1.5-flash ที่เสถียรและรองรับการเรียกใช้งานทั่วไป
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiReply = data.candidates[0].content.parts[0].text;
                
                container.innerHTML = `
                    <div class="bg-slate-900 border border-brand-500/30 p-3.5 rounded-xl space-y-2 text-slate-200">
                        <div class="font-bold text-brand-400 flex items-center justify-between pb-2 border-b border-slate-800">
                            <span><i class="fa-solid fa-sparkles mr-1"></i> ผลวิเคราะห์จาก Gemini AI</span>
                            <span class="text-[10px] text-slate-500">สำเร็จ</span>
                        </div>
                        <div class="markdown-body space-y-2 text-[11px]">
                            ${marked.parse(aiReply)}
                        </div>
                    </div>
                `;
                statusDot.className = 'w-2 h-2 rounded-full bg-green-500';
                showToast('AI ตรวจสอบโค้ดสำเร็จ!');

            } catch (err) {
                statusDot.className = 'w-2 h-2 rounded-full bg-red-500';
                container.innerHTML = `<div class="bg-red-950/40 border border-red-900 p-3 rounded-xl text-red-300 text-[11px]">เกิดข้อผิดพลาด: ${err.message}</div>`;
                showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ API');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
