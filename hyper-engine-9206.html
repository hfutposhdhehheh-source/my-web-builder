<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultimate Toolbox 240+</title>

<style>
*{box-sizing:border-box}
:root{
 --bg:#070910;
 --panel:#0f1420;
 --panel2:#151b2a;
 --text:#f4f7ff;
 --muted:#8995ac;
 --line:#273149;
 --accent:#6d7cff;
 --accent2:#9b5cff;
}
.light{
 --bg:#f3f5fa;
 --panel:#fff;
 --panel2:#edf0f6;
 --text:#111827;
 --muted:#68748b;
 --line:#d8deea;
}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;
 transition:.2s;
}
header{
 position:sticky;
 top:0;
 z-index:20;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:16px 5%;
 border-bottom:1px solid var(--line);
 background:color-mix(in srgb,var(--bg) 88%,transparent);
 backdrop-filter:blur(15px);
}
.logo{
 font-weight:1000;
 letter-spacing:2px;
 font-size:21px;
}
.logo b{color:var(--accent)}
header small{color:var(--muted)}
button{
 border:1px solid var(--line);
 background:var(--panel);
 color:var(--text);
 padding:10px 13px;
 border-radius:11px;
 cursor:pointer;
}
button:hover{border-color:var(--accent)}
.primary{
 background:var(--accent);
 color:white;
 border-color:var(--accent);
}
.hero{
 max-width:1200px;
 margin:auto;
 padding:55px 5% 25px;
}
.hero h1{
 font-size:clamp(38px,7vw,72px);
 line-height:.95;
 margin:0;
}
.hero h1 span{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 color:transparent;
 background-clip:text;
}
.hero p{color:var(--muted)}
.search{
 width:100%;
 padding:17px;
 border:1px solid var(--line);
 border-radius:15px;
 background:var(--panel);
 color:var(--text);
 font-size:16px;
 outline:none;
}
.info{
 max-width:1200px;
 margin:auto;
 padding:10px 5%;
 color:var(--muted);
}
.categories{
 max-width:1200px;
 margin:auto;
 padding:10px 5% 20px;
 display:flex;
 gap:8px;
 flex-wrap:wrap;
}
.categories button.active{
 background:var(--accent);
 color:white;
 border-color:var(--accent);
}
.grid{
 max-width:1300px;
 margin:auto;
 padding:0 5% 70px;
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
 gap:14px;
}
.card{
 position:relative;
 padding:18px;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:18px;
 cursor:pointer;
 transition:.18s;
}
.card:hover{
 transform:translateY(-3px);
 border-color:var(--accent);
}
.card .star{
 position:absolute;
 right:13px;
 top:13px;
 font-size:18px;
}
.card .icon{font-size:28px}
.card h3{font-size:16px;margin:10px 0 5px}
.card p{font-size:12px;color:var(--muted);margin:0}
.empty{
 grid-column:1/-1;
 padding:60px;
 text-align:center;
 color:var(--muted);
}
dialog{
 width:min(760px,94vw);
 max-height:90vh;
 border:1px solid var(--line);
 border-radius:20px;
 padding:0;
 background:var(--panel);
 color:var(--text);
 box-shadow:0 30px 100px #000b;
}
dialog::backdrop{background:#000b}
.modalHead{
 padding:18px 20px;
 border-bottom:1px solid var(--line);
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.modalHead h2{margin:0}
.modalHead small{color:var(--muted)}
.modalBody{padding:20px}
label{
 display:block;
 font-size:13px;
 color:var(--muted);
 margin-top:8px;
}
input,textarea,select{
 width:100%;
 padding:12px;
 margin:6px 0 10px;
 border:1px solid var(--line);
 border-radius:11px;
 background:var(--bg);
 color:var(--text);
 outline:none;
}
textarea{min-height:180px;resize:vertical}
.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}
.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
}
.result{
 margin-top:12px;
 min-height:70px;
 padding:14px;
 border-radius:12px;
 background:var(--bg);
 border:1px solid var(--line);
 white-space:pre-wrap;
 word-break:break-word;
}
.toast{
 position:fixed;
 right:20px;
 bottom:20px;
 padding:13px 17px;
 border-radius:12px;
 background:var(--panel2);
 border:1px solid var(--line);
 opacity:0;
 transform:translateY(15px);
 transition:.2s;
 z-index:100;
}
.toast.show{
 opacity:1;
 transform:none;
}
@media(max-width:600px){
 .grid{grid-template-columns:1fr 1fr}
 .row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
 <div>
  <div class="logo">ULTIMATE <b>TOOLBOX</b></div>
  <small id="counter">240 / 240 Tools</small>
 </div>
 <div>
  <button onclick="showFav()">⭐</button>
  <button onclick="theme()">🌙</button>
 </div>
</header>

<section class="hero">
 <h1>เครื่องมือ<br><span>สารพัดประโยชน์</span></h1>
 <p>240 เครื่องมือในหน้าเดียว</p>
 <input
  class="search"
  id="search"
  placeholder="🔎 ค้นหาเครื่องมือ..."
  oninput="render()"
 >
</section>

<div class="info" id="info"></div>
<div class="categories" id="categories"></div>
<main class="grid" id="grid"></main>

<dialog id="dlg">
 <div class="modalHead">
  <div>
   <h2 id="title"></h2>
   <small id="subtitle"></small>
  </div>
  <button onclick="dlg.close()">✕</button>
 </div>
 <div class="modalBody" id="body"></div>
</dialog>

<div class="toast" id="toast"></div>

"สุ่ม Emoji","สุ่มไอคอน","สุ่ม Yes/No","สุ่มจริง/เท็จ",

/* ตรวจจำนวน */
let TOOLS=[];
let num=1;

for(const [category,names] of Object.entries(groups)){
 for(const name of names){
  TOOLS.push({
   id:num++,
   name,
   category
  });
 }
}

console.assert(TOOLS.length===240,"จำนวน Tool ต้องเป็น 240");

let category="ทั้งหมด";
let favorites=JSON.parse(
 localStorage.getItem("ut_favorites")||"[]"
);

/* ==========================================================
   CATEGORY
========================================================== */

function makeCategories(){

 let html=`
 <button class="active"
 onclick="setCategory('ทั้งหมด',this)">
 ทั้งหมด
 </button>`;

 for(const cat of Object.keys(groups)){
  html+=`
  <button
   onclick="setCategory('${esc(cat)}',this)">
   ${cat}
  </button>`;
 }

 categories.innerHTML=html;
}

function setCategory(c,b){

 category=c;

 document.querySelectorAll(".categories button")
 .forEach(x=>x.classList.remove("active"));

 b.classList.add("active");

 render();
}

/* ==========================================================
   RENDER
========================================================== */

function render(){

 let q=search.value.toLowerCase();

 let list=TOOLS.filter(t=>
  (category==="ทั้งหมด"||t.category===category)&&
  (
   !q||
   t.name.toLowerCase().includes(q)||
   t.category.toLowerCase().includes(q)
  )
 );

 info.textContent=
 `แสดง ${list.length} / ${TOOLS.length} เครื่องมือ`;

 grid.innerHTML=list.length?

 list.map(t=>`
 <article class="card" onclick="openTool(${t.id})">

  <span class="star"
   onclick="event.stopPropagation();favorite(${t.id})">
   ${favorites.includes(t.id)?"⭐":"☆"}
  </span>

  <div class="icon">
   ${t.category.split(" ")[0]}
  </div>

  <h3>${esc(t.name)}</h3>

  <p>${esc(t.category.substring(2))}</p>

 </article>
 `).join("")

 :
 `<div class="empty">ไม่พบเครื่องมือ</div>`;
}

/* ==========================================================
   FAVORITE
========================================================== */

function favorite(id){

 if(favorites.includes(id))
  favorites=favorites.filter(x=>x!==id);
 else
  favorites.push(id);

 localStorage.setItem(
  "ut_favorites",
  JSON.stringify(favorites)
 );

 render();
}

function showFav(){

 category="__fav";

 info.textContent="⭐ รายการโปรด";

 let list=TOOLS.filter(x=>favorites.includes(x.id));

 grid.innerHTML=list.length?
 list.map(t=>`
 <article class="card" onclick="openTool(${t.id})">
  <span class="star">⭐</span>
  <div class="icon">${t.category.split(" ")[0]}</div>
  <h3>${esc(t.name)}</h3>
  <p>${esc(t.category.substring(2))}</p>
 </article>
 `).join("")
 :
 `<div class="empty">
 ยังไม่มีรายการโปรด
 </div>`;
}

/* ==========================================================
   TOOL UI
========================================================== */

function openTool(id){

 const t=TOOLS.find(x=>x.id===id);

 title.textContent=t.name;
 subtitle.textContent=t.category;

 body.innerHTML=buildUI(t.name);

 dlg.showModal();

 bind(t.name);
}

function buildUI(name){

 if([

   <div class="row">
    <div>

    </div>

 }

 if([

  "HEX → HSL","สุ่มสี","Invert Color","Grayscale",

   </div>

   <div class="result" id="result"></div>
  `;
 }

 if([
  "JSON Formatter","JSON Minifier","HTML Escape",
  "HTML Unescape","URL Encode","URL Decode",
  "Base64 Encode","Base64 Decode","Hex Encode",
  "Hex Decode","Binary Encode","Binary Decode",
  "JSON Stringify","JSON Pretty","JSON Compact",
  "JSON Keys","JSON Values","JSON Sort"
 ].includes(name)){

  return `
   <textarea id="input"
   placeholder="วางข้อมูลที่นี่..."></textarea>

   <div class="actions">
    <button class="primary" id="run">ประมวลผล</button>
    <button id="copy">คัดลอก</button>
   </div>

   <div class="result" id="result"></div>
  `;
 }

 if([
  "สร้างรหัสผ่าน","สุ่ม Password","สร้าง PIN",
  "สุ่ม PIN 4 หลัก","สุ่ม PIN 6 หลัก","สุ่มรหัส 8 หลัก",
  "สุ่ม Token","สุ่ม Secret","สุ่ม Hex","สุ่ม Base64"
 ].includes(name)){

  return `
   <p style="color:var(--muted)">
   สร้างข้อมูลแบบสุ่มด้วย Web Crypto API
   </p>

   <button class="primary" id="run">
   สร้าง

   <button id="copy">คัดลอก</button>

   <div class="result" id="result"></div>
  `;
 }

  <label>ข้อมูล</label>
  <input id="input" placeholder="ป้อนข้อมูล...">

  <div class="actions">
   <button class="primary" id="run">ทำงาน</button>
   <button id="copy">คัดลอก</button>
  </div>

  <div class="result" id="result"></div>
 `;
}

/* ==========================================================
   BIND
========================================================== */

function bind(name){

 const run=document.getElementById("run");
 const copy=document.getElementById("copy");

 if(run){

  run.onclick=()=>{

   let a=document.getElementById("a")?.value;
   let b=document.getElementById("b")?.value;
   let input=document.getElementById("input")?.value||"";

   let result;

   try{

    if(a!==undefined&&b!==undefined)
     result=math(name,Number(a),Number(b));
    else
     result=tool(name,input);

   }catch(e){

    result="❌ "+e.message;

   }

   document.getElementById("result").textContent=
   String(result);
  };
 }

 if(copy){

  copy.onclick=async()=>{

   const result=document.getElementById("result");

   if(!result)return;

   await navigator.clipboard.writeText(result.textContent);

   toast("คัดลอกแล้ว ✅");
  };
 }
}

/* ==========================================================
   MATH ENGINE
========================================================== */

function math(n,a,b){

 switch(n){

 case"เครื่องคิดเลข":
  return a+b;

 case"เปอร์เซ็นต์":
  return `${a}% ของ ${b} = ${a*b/100}`;

 case"ส่วนลด":
  return `ราคาหลังลด = ${a-(a*b/100)}`;

 case"ทิป":
  return `ยอดรวม = ${a+(a*b/100)}`;

 case"ค่าเฉลี่ย":
  return (a+b)/2;

 case"ผลรวม":
  return a+b;

 case"GCD":
  return gcd(a,b);

 case"LCM":
  return Math.abs(a*b)/gcd(a,b);

 case"เลขยกกำลัง":
  return Math.pow(a,b);

 case"อัตราส่วน":
  return `${a}:${b}`;

 case"กฎสาม":
  return `ผลลัพธ์ = ${a*b}`;

 case"กำไร":
  return a-b;

 case"มาร์จิน":
  return ((a-b)/a*100).toFixed(2)+"%";

 case"ส่วนต่าง":
  return Math.abs(a-b);

 default:
  return a+b;
 }
}

function gcd(a,b){

 a=Math.abs(a);
 b=Math.abs(b);

 while(b){
  [a,b]=[b,a%b];
 }

 return a;
}

/* ==========================================================
   MAIN TOOL ENGINE
========================================================== */

function tool(n,v){

 switch(n){

 /* ---------- TEXT ---------- */

 case"นับตัวอักษร":
  return [...v].length;

 case"นับคำ":
  return v.trim()?v.trim().split(/\s+/).length:0;

 case"นับบรรทัด":
  return v?v.split(/\r?\n/).length:0;

 case"ตัวพิมพ์ใหญ่":
  return v.toUpperCase();

 case"ตัวพิมพ์เล็ก":
  return v.toLowerCase();

 case"Title Case":
  return v.toLowerCase()

 case"กลับข้อความ":

/* ==========================================================
   HELPER FUNCTIONS
========================================================== */

function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function randomPassword(length){
  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*";

  let result="";

  for(let i=0;i<length;i++){
    result += chars[rand(0,chars.length-1)];
  }

  return result;
}

function cryptoHex(bytes){
  const data=new Uint8Array(bytes);
  crypto.getRandomValues(data);

  return [...data]
    .map(x=>x.toString(16).padStart(2,"0"))
    .join("");
}

function cryptoBase64(bytes){
  const data=new Uint8Array(bytes);
  crypto.getRandomValues(data);

  let binary="";

  for(const byte of data){
    binary+=String.fromCharCode(byte);
  }

  return btoa(binary);
}

function passwordStrength(password){

  let score=0;

  if(password.length>=8)score++;
  if(password.length>=12)score++;
  if(/[A-Z]/.test(password))score++;
  if(/[a-z]/.test(password))score++;
  if(/[0-9]/.test(password))score++;
  if(/[^A-Za-z0-9]/.test(password))score++;

  const levels=[
    "อ่อนมาก ❌",
    "อ่อน ⚠️",
    "ปานกลาง 🟡",
    "ดี 🟢",
    "แข็งแรง 🟢",
    "แข็งแรงมาก 💪",
    "ยอดเยี่ยม 🔥"
  ];

  return levels[Math.min(score,6)];
}

function entropy(password){

  let pool=0;

  if(/[a-z]/.test(password))pool+=26;
  if(/[A-Z]/.test(password))pool+=26;
  if(/[0-9]/.test(password))pool+=10;
  if(/[^A-Za-z0-9]/.test(password))pool+=32;

  if(pool===0)return "0 bits";

  return (
    password.length*Math.log2(pool)
  ).toFixed(2)+" bits";
}

function hexToRgb(hex){

  let h=String(hex)
    .trim()
    .replace("#","");

  if(h.length===3){
    h=h.split("")
      .map(x=>x+x)
      .join("");
  }

  if(!/^[0-9a-fA-F]{6}$/.test(h)){
    throw new Error("HEX ต้องเป็น #RRGGBB");
  }

  const n=parseInt(h,16);

  return `rgb(${
    (n>>16)&255
  }, ${
    (n>>8)&255
  }, ${
    n&255
  })`;
}

function rgbToHex(value){

  const nums=
    String(value).match(/\d+/g);

  if(!nums||nums.length<3){
    throw new Error("ใส่ RGB เช่น 255,0,0");
  }

  return "#"+
    nums.slice(0,3)
      .map(x=>
        Number(x)
          .toString(16)
          .padStart(2,"0")
      )
      .join("");
}

function invert(hex){

  let h=String(hex)
    .trim()
    .replace("#","");

  if(h.length===3){
    h=h.split("")
      .map(x=>x+x)
      .join("");
  }

  const n=parseInt(h,16);

  return "#"+
    (0xFFFFFF^n)
      .toString(16)
      .padStart(6,"0");
}

function gray(hex){

  const rgb=
    hexToRgb(hex)
      .match(/\d+/g)
      .map(Number);

  const value=Math.round(
    rgb[0]*0.299+
    rgb[1]*0.587+
    rgb[2]*0.114
  );

  return `rgb(${value},${value},${value})`;
}

function mix(a,b,amount){

  const c1=
    hexToRgb(a)
      .match(/\d+/g)
      .map(Number);

  const c2=
    hexToRgb(b)
      .match(/\d+/g)
      .map(Number);

  return rgbToHex(
    `${Math.round(c1[0]+(c2[0]-c1[0])*amount)},
     ${Math.round(c1[1]+(c2[1]-c1[1])*amount)},
     ${Math.round(c1[2]+(c2[2]-c1[2])*amount)}`
  );
}

function mime(filename){

  const ext=
    String(filename)
      .split(".")
      .pop()
      .toLowerCase();

  const types={
    png:"image/png",
    jpg:"image/jpeg",
    jpeg:"image/jpeg",
    gif:"image/gif",
    webp:"image/webp",
    svg:"image/svg+xml",
    json:"application/json",
    txt:"text/plain",
    csv:"text/csv",
    html:"text/html",
    htm:"text/html",
    css:"text/css",
    js:"text/javascript",
    mjs:"text/javascript",
    xml:"application/xml",
    pdf:"application/pdf",
    zip:"application/zip",
    mp3:"audio/mpeg",
    wav:"audio/wav",
    mp4:"video/mp4",
    webm:"video/webm"
  };

  return types[ext]||"ไม่ทราบ MIME Type";
}

function csvJson(text){

  const lines=
    text.trim().split(/\r?\n/);

  if(!lines.length)return [];

  const headers=
    lines[0]
      .split(",")
      .map(x=>x.trim());

  return lines.slice(1).map(line=>{

    const values=line.split(",");
    const obj={};

    headers.forEach((header,index)=>{
      obj[header]=values[index]??"";
    });

    return obj;
  });
}

function jsonCsv(text){

  const data=JSON.parse(text);

  if(!Array.isArray(data)){
    throw new Error("JSON ต้องเป็น Array");
  }

  if(!data.length)return "";

  const headers=[
    ...new Set(
      data.flatMap(x=>Object.keys(x))
    )
  ];

  const rows=[
    headers.join(",")
  ];

  for(const item of data){

    rows.push(
      headers.map(key=>{
        const value=item[key]??"";

        return `"${String(value)
          .replaceAll('"','""')}"`;
      }).join(",")
    );

  }

  return rows.join("\n");
}

function download(
  content,
  filename,
  type="text/plain"
){

  const blob=
    new Blob([content],{type});

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;
  a.download=filename;

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>{
    URL.revokeObjectURL(url);
  },1000);
}

function esc(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
